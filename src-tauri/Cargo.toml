[package]
name = "morse-trainer"
version = "2.0.0"
description = "Morse Trainer: learn and practise Morse code (CW)"
authors = ["Keep It Simple Analytics"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519, Windows).
name = "morse_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
