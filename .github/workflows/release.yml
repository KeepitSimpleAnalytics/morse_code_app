name: Release

# SPEC §14.2: a v* tag builds the Windows installer (the primary asset) and the
# untested universal macOS .dmg, and puts both on a draft GitHub Release.
# Publish the draft by hand once the Windows installer has passed QA
# (docs/release.md). There is no updater yet, so nothing here is signed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Checks the tag, runs the same gate as CI, and creates the one draft release
  # both builds upload to (two builds creating it at once could make two drafts).
  create-release:
    name: Check and create draft
    runs-on: windows-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $version (tauri.conf.json)."
            exit 1
          fi

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Create the draft release, or reuse it on a re-run
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find_draft() {
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq "[.[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id] | first // empty"
          }
          id=$(find_draft)
          if [ -z "$id" ]; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Morse Trainer $GITHUB_REF_NAME" --notes-file .github/release-notes.md
            id=$(find_draft)
          fi
          if [ -z "$id" ]; then
            echo "::error::No draft release found for $GITHUB_REF_NAME (is it already published?)"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    # SPEC §1.3: macOS is best-effort and never blocks the Windows release.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            args: ""
            rust-targets: ""
          - os: macos-latest
            label: macOS dmg (untested)
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}
